<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Resume Builder</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- ✅ PDF LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #2b2b2b;
}

/* FORM */
.form {
  width: 800px;
  margin: 20px auto;
  background: #fff;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.form input {
  padding: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  background: #1abc9c;
  color: white;
  border: none;
  cursor: pointer;
}

/* DOWNLOAD BUTTON */
.download-btn{
  background:#e67e22;
}

/* RESUME */
.resume {
  width: 800px;
  margin: auto;
  display: flex;
  background: #fff;
}

/* LEFT */
.left {
  flex: 1;
  background: #1abc9c;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.profile {
  text-align: center;
}

.profile img {
  width: 90px;
  border-radius: 50%;
}

.section h3 {
  border-bottom: 1px solid rgba(255,255,255,0.5);
}

/* Skill bar */
.skill {
  margin-bottom: 10px;
}

.bar {
  height: 4px;
  background: rgba(255,255,255,0.4);
}

.fill {
  height: 4px;
  background: white;
  width: 0;
}

/* RIGHT */
.right {
  flex: 2;
  padding: 25px;
}

.header h1 {
  color: #1abc9c;
  margin: 0;
}

.section {
  margin-top: 20px;
}

.section h3 {
  color: #1abc9c;
  border-bottom: 1px solid #ddd;
}

/* Timeline */
.item {
  display: flex;
  margin-bottom: 10px;
}

.year {
  width: 80px;
  font-size: 12px;
  color: gray;
}

.details {
  font-size: 13px;
}
</style>

</head>

<body>

<!-- FORM -->
<div class="form">
  <h2>Enter Your Details</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="title" placeholder="Job Title">
  <input type="text" id="statement" placeholder="Statement">

  <input type="text" id="eduYear" placeholder="Education Year">
  <input type="text" id="eduName" placeholder="Education Title">

  <input type="text" id="expYear" placeholder="Experience Year">
  <input type="text" id="expName" placeholder="Company Name">

  <input type="text" id="skill" placeholder="Skill">
  <input type="number" id="skillVal" placeholder="Skill %">

  <input type="text" id="language" placeholder="Languages (comma separated)">

  <button id="generate">Generate Resume</button>

  <!-- ✅ NEW DOWNLOAD BUTTON -->
  <button class="download-btn" onclick="downloadPDF()">Download Resume</button>
</div>

<!-- RESUME -->
<div class="resume" id="resume">

  <!-- LEFT -->
  <div class="left">

    <div class="profile">
      <img src="https://via.placeholder.com/100">
      <h2 id="rName">Your Name</h2>
      <p id="rTitle">Job Title</p>
    </div>

    <div class="section">
      <h3>STATEMENT</h3>
      <p id="rStatement">---</p>
    </div>

    <div class="section">
      <h3>SKILLS</h3>
      <div id="skillsBox"></div>
    </div>

    <div class="section">
      <h3>LANGUAGES</h3>
      <div id="langBox"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="header">
      <h1 id="rName2">Your Name</h1>
      <p id="rTitle2">Job Title</p>
    </div>

    <div class="section">
      <h3>EDUCATION</h3>
      <div class="item">
        <div class="year" id="rEduYear">----</div>
        <div class="details" id="rEduName">Education</div>
      </div>
    </div>

    <div class="section">
      <h3>WORK EXPERIENCE</h3>
      <div class="item">
        <div class="year" id="rExpYear">----</div>
        <div class="details" id="rExpName">Experience</div>
      </div>
    </div>

    <div class="section">
      <h3>REFERENCE</h3>
      <p>Available on request</p>
    </div>

  </div>

</div>

<script>
$(function(){

  $("#generate").click(function(){

    let name = $("#name").val();
    let title = $("#title").val();
    let statement = $("#statement").val();
    let eduYear = $("#eduYear").val();
    let eduName = $("#eduName").val();
    let expYear = $("#expYear").val();
    let expName = $("#expName").val();
    let skill = $("#skill").val();
    let skillVal = $("#skillVal").val();
    let langs = $("#language").val().split(",");

    $("#rName, #rName2").text(name);
    $("#rTitle, #rTitle2").text(title);
    $("#rStatement").text(statement);

    $("#rEduYear").text(eduYear);
    $("#rEduName").text(eduName);

    $("#rExpYear").text(expYear);
    $("#rExpName").text(expName);

    if(skill && skillVal){
      $("#skillsBox").html(`
        <div class="skill">
          <span>${skill}</span>
          <div class="bar">
            <div class="fill"></div>
          </div>
        </div>
      `);
      $(".fill").animate({width: skillVal + "%"}, 800);
    }

    let html = "";
    langs.forEach(l => {
      if(l.trim()){
        html += "<p>" + l.trim() + "</p>";
      }
    });
    $("#langBox").html(html);

  });

});

/* ✅ DOWNLOAD FUNCTION */
function downloadPDF(){

  let element = document.getElementById("resume");

  let opt = {
    margin:0.3,
    filename:'Resume.pdf',
    image:{ type:'jpeg', quality:1 },
    html2canvas:{ scale:2 },
    jsPDF:{ unit:'in', format:'a4', orientation:'portrait' }
  };

  html2pdf().set(opt).from(element).save();
}
</script>

</body>
</html>
